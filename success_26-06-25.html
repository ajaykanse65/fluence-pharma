<!DOCTYPE html>
<html lang="en">

<head>

  <style>
    body {
      margin: 0;
      font-family: 'Roboto Condensed', sans-serif;
    }

    .content {
      text-align: center;

      color: #000;
      margin: 40px auto;

      width: 100%;
      max-width: 960px;
      border-radius: 5px;
      padding-bottom: 32px;
    }

    h1,
    h1 a {
      min-height: 80px;
      width: 90%;
      max-width: 700px;
      vertical-align: middle;
      text-align: center;
      margin: 0 auto;
      text-decoration: none;
      color: #000;
      padding-top: 10px;
    }

    p {

      text-align: center;
      width: 90%;
      max-width: 700px;
      font-size: 18px;

      margin: 0 auto;
      padding-bottom: 32px;
    }

    .btn,
    .btn:active,
    .btn:active:focus,
    .btn:visited,
    .btn:focus {
      text-decoration: none;
      color: #fff;
      outline: none;
      background-color: #393186;
      box-shadow: none !important;
    }

    .btn:not([data-animation]) {
      transition: all .2s ease;
    }

    body:not(.has-btn-not-upper) .btn {
      text-transform: capitalize;
    }

    .btn {
      font-family: 'Roboto Condensed', sans-serif;
      font-size: 14px;
      font-weight: 600;
      line-height: 16px;
      padding: 15px 30px;
      cursor: pointer;
      white-space: nowrap;
      border: 0 !important;
      border-radius: 4px;
    }

    .btn:hover,
    .btn.hovered,
    .btn:active:hover,
    .btn:focus:hover {
      transition: all .2s ease;
      color: #fff;
      outline: 0;
      background-color: #afcb1f;
    }

    .body {
      width: 100%;
      height: 700px !important;
      padding-top: 3%;
      background-color: transparent;
      background-image: url('images/success-bg.jpg');
      background-repeat: no-repeat;
      height: 100%;
      background-size: 100% 90%;
    }

    @media (min-width:768px) and (max-width:992px) {
      #spacing {
        height: 540px !important;
      }

      .hdr-logo img {
        margin-top: 33%;
      }

      .body {
        width: 100%;
        height: 1020px !important;
        padding-top: 3%;
        background-color: transparent;
        background-image: url('images/success-bg-mobile.jpg');
        background-repeat: no-repeat;
        height: 100%;
        background-size: 100% 97%;
      }
    }

    @media (min-width:992px) and (max-width:1200px) {
      #spacing {
        height: 800px !important;
      }

      .hdr-logo img {
        margin-top: 33%;
      }

      .body {
        width: 100%;
        height: 1312px !important;
        padding-top: 3%;
        background-color: transparent;
        background-image: url('images/success-bg-mobile.jpg');
        background-repeat: no-repeat;
        height: 100%;
        background-size: 100% 100%;
      }

    }

    @media screen and (max-width:767px) {
      #spacing {
        height: 250px !important;
      }

      .body {
        width: 100%;
        height: 700px !important;
        padding-top: 3%;
        background-color: transparent;
        background-image: url('images/success-bg-mobile.jpg');
        background-repeat: no-repeat;
        height: 100%;
        background-size: 100% 100%;
      }

      .hdr-logo img {
        margin-top: 10%;
      }
    }
  </style>

        <a href="index.html" class="btn button">Visit Our Website</a>
      </div>

    </div>
    <div id="spacing" style="height:120px">&nbsp;</div>

  </div>
